<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>頁面一 · 變體 C · 卡片式垂直 Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
  rel="stylesheet"
/>
<style>
  @font-face {
    font-family: "Chenyuluoyan";
    src: url("https://cdn.jsdelivr.net/npm/@fontpkg/chenyuluoyan@1.0.0/ChenYuluoyan-Thin.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    --grey-50:#fbf7ef; --grey-100:#f5ecd9; --grey-200:#ecdfc2; --grey-300:#ddcca8; --grey-400:#c2ac84;
    --grey-500:#a08a63; --grey-600:#7a6849; --grey-700:#5a4c37; --grey-800:#3c2f2f; --grey-900:#241c1c;
    --primary-50:#fdf3ec; --primary-100:#f6ded0; --primary-300:#e8b28c; --primary-500:#c17a3d;
    --primary-600:#a1622c; --primary-700:#7c4a20;
    --success-100:#e2ead9; --success-500:#6f8f5c; --success-700:#445739;
    --danger-100:#f5d9d3; --danger-500:#b0402a; --danger-600:#8f3220;
    --radius-sm:4px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
    --shadow-card: 6px 8px 0 rgba(124,74,32,.12), 0 2px 6px rgba(60,47,47,.14);
    --shadow-button: 3px 4px 0 rgba(124,74,32,.3);
    --font-hand: "Corinthia", "Chenyuluoyan", "PingFang TC", "Microsoft JhengHei", cursive;
    --font-serif: "Playfair Display", "PingFang TC", "Microsoft JhengHei", serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--grey-100); color: var(--grey-900); font-family: var(--font-serif); line-height:1.6; }

  .app-nav { display:flex; gap:8px; padding:16px 24px; background:var(--grey-100); border-bottom:2px dashed var(--grey-400); }
  .app-nav a { font-family: var(--font-hand); font-size:20px; color:var(--grey-600); text-decoration:none; padding:8px 16px; border-radius:10px; }
  .app-nav a.active { background:var(--primary-100); color:var(--primary-700); }

  main { max-width: 560px; margin: 0 auto; padding: 32px 24px 64px; }
  .variant-label { font-family: ui-monospace, monospace; font-size:12px; color: var(--grey-500); margin-bottom: 8px; }
  h1.page-title { font-family: var(--font-hand); font-size:36px; font-weight:400; margin:0 0 24px; }

  .today-card {
    position: relative;
    background: var(--grey-50); border-radius: var(--radius-lg);
    box-shadow: 0 0 0 2px var(--primary-300), var(--shadow-card);
    padding:24px; margin-bottom: 40px;
  }
  .today-ribbon {
    position: absolute; top: -12px; left: 20px;
    font-family: var(--font-hand); font-size: 16px; font-weight: 700;
    background: var(--primary-500); color: var(--grey-50);
    padding: 4px 16px; border-radius: var(--radius-pill);
    box-shadow: 0 2px 4px rgba(60,47,47,.2);
  }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin: 8px 0 12px; }
  .badge { font-size:12px; font-weight:600; padding:4px 12px; border-radius:var(--radius-pill); background:var(--success-100); color:var(--success-700); }
  .badge.draft { background:var(--primary-100); color:var(--primary-700); }
  time { font-size:13px; color:var(--grey-500); font-family: ui-monospace, monospace; }

  textarea.dream-textarea {
    width:100%; min-height:160px; font-family: var(--font-serif); font-size:16px; color:var(--grey-900);
    background:var(--grey-50); border:1.5px solid var(--grey-300); border-radius: var(--radius-sm); padding:12px 16px;
    resize: vertical; margin-bottom:8px;
  }
  .char-count { font-size:13px; color: var(--grey-500); text-align:right; font-family: ui-monospace, monospace; margin-bottom:20px; }

  .actions { display:flex; justify-content:space-between; gap:12px; }
  .btn { font-family: var(--font-serif); font-size:14px; font-weight:600; padding:10px 20px; border-radius: var(--radius-md); border:1.5px solid transparent; cursor:pointer; }
  .btn-primary { background: var(--primary-500); color: var(--grey-50); box-shadow: var(--shadow-button); }
  .btn-ghost { background:transparent; color: var(--primary-600); border-color: var(--primary-300); }
  .btn-danger-ghost { background:transparent; color: var(--danger-600); border-color: var(--danger-100); }

  .section-heading { font-family: var(--font-hand); font-size:24px; font-weight:400; margin: 0 0 16px; padding-bottom:8px; border-bottom: 2px dashed var(--grey-400); }

  .card { background: var(--grey-50); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding:24px; }

  .analysis { margin-top:20px; padding-top:20px; border-top: 2px dashed var(--grey-300); }
  .analysis h3 { font-family: var(--font-hand); font-size:20px; font-weight:400; margin:0 0 8px; }
  .keyword-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .keyword { font-size:12px; background:var(--grey-200); color:var(--grey-700); padding:4px 10px; border-radius: var(--radius-pill); }
  .image-placeholder { width:100%; aspect-ratio: 4/3; background: var(--grey-200); border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; color:var(--grey-500); font-size:13px; }

  .history-nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top: 2px dashed var(--grey-300); }
  .history-nav .btn:disabled { opacity:.4; cursor:not-allowed; }
  .history-date { font-family: ui-monospace, monospace; font-size:13px; color: var(--grey-600); }

  @media (max-width: 640px) {
    .actions { flex-direction: column; }
    .history-nav { flex-direction: column; gap:8px; }
  }
</style>
</head>
<body>
<nav class="app-nav">
  <a href="#" class="active">寫日記/看日記</a>
  <a href="#">數據統計看板</a>
</nav>

<main>
  <p class="variant-label">變體 C · 卡片式垂直 Feed（今日卡片釘選頂部，翻閱舊日記在其下方單張卡片瀏覽）</p>
  <h1 class="page-title">夢境日記</h1>

  <div class="today-card">
    <span class="today-ribbon">今天</span>
    <div class="card-head">
      <span class="badge draft">撰寫中</span>
      <time>2026年8月13日</time>
    </div>
    <textarea class="dream-textarea" placeholder="今天的夢還記得嗎？寫下來吧。">夢裡我沿著河邊走，看到遠處有一串發光的燈籠，跟著它們走進了一片濃霧森林……</textarea>
    <div class="char-count">36 / 2000</div>
    <div class="actions">
      <button class="btn btn-danger-ghost">刪除</button>
      <button class="btn btn-primary">完成</button>
    </div>
  </div>

  <h2 class="section-heading">翻閱舊日記</h2>
  <div class="card">
    <div class="card-head">
      <span class="badge">已完成</span>
      <time>2026年8月10日</time>
    </div>
    <p style="margin:0 0 4px;">「在夢裡，我變成一隻鳥，飛過整座城市，看見小時候住的老房子還亮著燈……」</p>
    <div class="analysis">
      <h3>AI 分析</h3>
      <div class="keyword-row">
        <span class="keyword">懷舊</span>
        <span class="keyword">飛翔</span>
        <span class="keyword">溫暖</span>
      </div>
      <div class="image-placeholder">AI 生成圖片（placeholder）</div>
    </div>
    <div class="history-nav">
      <button class="btn btn-ghost">← 上一篇</button>
      <span class="history-date">共 12 篇 · 第 3 篇</span>
      <button class="btn btn-ghost" disabled>下一篇 →</button>
    </div>
  </div>
</main>
</body>
</html>
